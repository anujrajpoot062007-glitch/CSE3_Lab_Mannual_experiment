<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h2 {
            text-align: center;
        }
        form {
            width: 500px;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 30px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 100px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 300px;
            padding: 5px;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form>
        <div class="form-group">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter valid email address">
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="form-group">
            <label>Gender:</label>
            <input type="radio" id="male" name="gender"> <label for="male" style="width:auto; margin-right:15px;">Male</label>
            <input type="radio" id="female" name="gender"> <label for="female" style="width:auto; margin-right:15px;">Female</label>
            <input type="radio" id="other" name="gender"> <label for="other" style="width:auto;">Other</label>
        </div>

        <div class="form-group">
            <label for="course">Course:</label>
            <select id="course">
                <option value="">-- Select Course --</option>
                <option value="btech">B.Tech</option>
                <option value="bsc">B.Sc</option>
                <option value="bca">BCA</option>
            </select>
        </div>

        <div class="form-group">
            <label for="contact">Contact No:</label>
            <input type="text" id="contact" placeholder="Enter phone number">
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" placeholder="Enter your address"></textarea>
        </div>

        <div class="form-group" style="margin-left: 100px;">
            <button type="submit">Register</button>
            <button type="reset">Clear</button>
        </div>
    </form>

    <div class="footer-text">
        &copy; 2025 Student Registration Portal
    </div>

</body>
</html>
